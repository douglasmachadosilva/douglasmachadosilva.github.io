<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Douglas Machado</title>

  <meta
    name="description"
    content="Douglas Machado — Ensino tecnologia. Inteligência Artificial, Ciência de Dados, Bancos de Dados, Low-Code e Automação."
  >

  <style>
    :root {
      --background: #f8f8f6;
      --text: #171717;
      --secondary: #666;
      --border: #d8d8d4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(1100px, calc(100% - 48px));

      height: 100dvh;
      min-height: 600px;

      margin: 0 auto;
      padding: clamp(28px, 6vh, 64px) 0;

      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    /* Nome */

    .name {
      margin: 0;

      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Conteúdo principal */

    .content {
      max-width: 900px;
      align-self: center;
    }

    h1 {
      margin: 0 0 28px;

      font-size: clamp(3.2rem, 8vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 650;
    }

    .statement {
      max-width: 800px;
      margin: 0;

      font-size: clamp(1.35rem, 2.5vw, 2rem);
      line-height: 1.4;
      letter-spacing: -0.025em;

      color: var(--secondary);
    }

    /* Áreas de atuação */

    .areas {
      max-width: 850px;

      margin: 52px 0 0;
      padding-top: 24px;

      border-top: 1px solid var(--border);

      font-size: 1rem;
      line-height: 1.8;
      font-weight: 500;
    }

    /* Links */

    footer {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    footer a {
      color: var(--text);

      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;

      border-bottom: 1px solid transparent;

      transition:
        border-color 150ms ease,
        opacity 150ms ease;
    }

    footer a:hover {
      border-color: currentColor;
    }

    footer a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
    }

    /* Celular */

    @media (max-width: 600px) {

      main {
        width: calc(100% - 40px);

        min-height: 560px;

        padding: 28px 0;
      }

      h1 {
        margin-bottom: 24px;

        font-size: clamp(3rem, 16vw, 4.5rem);
      }

      .statement {
        font-size: 1.3rem;
      }

      .areas {
        margin-top: 36px;
        padding-top: 20px;

        line-height: 1.7;
      }

      footer {
        gap: 20px;
      }
    }

  </style>
</head>

<body>

  <main>

    <header>
      <p class="name">Douglas Machado</p>
    </header>

    <section class="content">

      <h1>
        Ensino<br>
        tecnologia.
      </h1>

      <p class="statement">
        Transformo o complexo em experiências de aprendizado
        que ajudam mais pessoas a participar do futuro digital.
      </p>

      <p class="areas">
        Inteligência Artificial · Ciência de Dados · Bancos de Dados ·
        Low-Code &amp; Automação
      </p>

    </section>

    <footer>

      <a
        href="https://www.linkedin.com/in/douglasmachadosilva/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn ↗
      </a>

      <a
        href="http://lattes.cnpq.br/3337182570290455"
        target="_blank"
        rel="noopener noreferrer"
      >
        Currículo Lattes ↗
      </a>

    </footer>

  </main>

</body>
</html>
